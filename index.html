<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>AI Chatbot</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

    <div class="max-w-3xl mx-auto p-5">

        <h1 class="text-3xl font-bold mb-5">
            AI Chatbot
        </h1>

        <!-- CHAT BOX -->
        <div
            id="chatbox"
            class="bg-white h-[500px] overflow-y-auto rounded-xl shadow p-4 space-y-4"
        >

        </div>

        <!-- INPUT -->
        <div class="flex gap-2 mt-4">

            <input
                type="text"
                id="message"
                placeholder="Nhập tin nhắn..."
                class="flex-1 border rounded-xl p-3"
            >

            <button
                onclick="sendMessage()"
                class="bg-black text-white px-5 rounded-xl"
            >
                Gửi
            </button>

        </div>

    </div>


    <script>

        async function sendMessage(){

            const input = document.getElementById("message")

            const message = input.value

            const chatbox = document.getElementById("chatbox")


            // USER MESSAGE
            chatbox.innerHTML += `
                <div class="text-right">
                    <div class="inline-block bg-blue-500 text-white px-4 py-2 rounded-2xl">
                        ${message}
                    </div>
                </div>
            `


            // FETCH API
            const response = await fetch(
                "http://127.0.0.1:5000/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            )


            const data = await response.json()


            // AI MESSAGE
            chatbox.innerHTML += `
                <div class="text-left">
                    <div class="inline-block bg-gray-200 px-4 py-2 rounded-2xl">
                        ${data.response}
                    </div>
                </div>
            `


            // CLEAR INPUT
            input.value = ""


            // AUTO SCROLL
            chatbox.scrollTop = chatbox.scrollHeight
        }

    </script>

</body>

</html>
