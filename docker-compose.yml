# ── Chatbot – Văn Phú Đức ─────────────────────────────────────────────────────
# Services:
#   ollama   – local LLM runtime (models stored in a named volume)
#   backend  – Flask / LangChain / FAISS  (depends on ollama)
#   frontend – React SPA served by nginx   (depends on backend)
#
# Quick start:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull bge-m3
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose up --build -d
#
# The UI is served at http://localhost:3000 and proxies /chat to the backend.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama LLM runtime ───────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama   # persist downloaded models
    # Ollama is only consumed by the backend on the internal Compose network.
    # Publishing 11434 is unnecessary and conflicts with a host Ollama install.
    # Uncomment to access it directly from the host:
    # ports:
    #   - "11434:11434"
    # GPU passthrough (uncomment if you have an NVIDIA GPU and nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Python backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chatbot-backend
    restart: unless-stopped
    env_file:
      # Optional – overrides defaults from backend/Dockerfile and `environment`.
      - path: backend/.env
        required: false
    environment:
      CHATBOT_OLLAMA_BASE_URL: http://ollama:11434
      CHATBOT_SOURCE_PATH: backend/data/chatbot.txt
      CHATBOT_COURSES_PATH: backend/data/sources/courses.csv
      CHATBOT_ALIASES_PATH: backend/data/sources/aliases.txt
      CHATBOT_INBOX_DIR: backend/data/inbox
      CHATBOT_LEGACY_SOURCES: "false"
      CHATBOT_DOC_INDEX_DIR: backend/doc_index
      CHATBOT_QUERY_REWRITE: "off"
      ENABLE_LLM_SUMMARY: "false"
      FLASK_ENV: production
      PYTHONUNBUFFERED: "1"
    volumes:
      # Unified source is read-only; the derived document index is writable
      # and must survive container rebuilds.
      - ./backend/data:/app/backend/data:ro
      - ./backend/doc_index:/app/backend/doc_index
    ports:
      - "5000:5000"           # expose for direct testing; nginx proxies in prod
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # TCP check: the Flask app only starts listening after warm_up() has
      # validated Ollama, both models and the FAISS index.
      test: ["CMD", "python", "-c",
             "import socket, sys; s = socket.socket(); s.settimeout(2); sys.exit(s.connect_ex(('127.0.0.1', 5000)))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s     # allow time for FAISS index to build on first run

  # ── React / Vite frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # In Docker networking the browser talks to nginx which proxies /chat.
        # Setting the URL to "" (or "/") makes the frontend call /chat relative
        # to its own origin, which nginx then forwards to the backend service.
        VITE_API_BASE_URL: ""
    container_name: chatbot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  ollama_models:
    driver: local
